<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../logo.ico">
<title>Abstraction — ABST</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/scroll-expand.css">
<link rel="stylesheet" href="../css/carousel.css">
<link rel="stylesheet" href="../css/staggered-menu.css">
<link rel="stylesheet" href="../css/target-cursor.css">
<link rel="stylesheet" href="../css/page-transitions.css">
</head>
<body>

<header class="site-header solid">
  <div class="container header-inner">
    <a href="../index-ko.html" class="logo cursor-target"><img src="../logo.png" alt="" class="logo-mark">ABST</a>
    <div class="header-actions">
      <a class="lang-switch cursor-target" href="abstraction.html">EN</a>
      <div id="site-menu" data-base="../"></div>
    </div>
  </div>
</header>

<main class="ptx-content" data-project-gallery="abstraction">

<section id="project-hero-scroll-expand" class="scroll-expand-hero"
  data-title="Abstraction"
  data-eyebrow="준비 중"
  data-cta="더 읽으려면 스크롤하세요 ↓"
  data-image="../images/abstraction.png"
></section>

<article class="post-page has-gallery" id="project-content">
  <a class="back-link cursor-target" href="../projects-ko.html">&larr; 프로젝트로 돌아가기</a>
  <p class="post-meta">준비 중</p>
  <h1>Abstraction</h1>
  <p>이 프로젝트 페이지는 아직 준비 중입니다. 자세한 내용은 곧 공개될 예정이니 나중에 다시 확인해 주세요.</p>
</article>

<section class="carousel-section" id="project-carousel">
  <div class="carousel-shell">
    <button id="project-carousel-prev" class="carousel-arrow cursor-target" type="button" aria-label="왼쪽으로 스크롤">&larr;</button>
    <div id="project-carousel-track" class="carousel-viewport"></div>
    <button id="project-carousel-next" class="carousel-arrow cursor-target" type="button" aria-label="오른쪽으로 스크롤">&rarr;</button>
  </div>
</section>

<section class="text-columns container">
  <div class="text-column">
    <h2>프로젝트 소개</h2>
    <p>Abstraction의 주제와 참여 작가에 대한 세부 내용은 아직 준비 중입니다 — 곧 다시 확인해 주세요.</p>
  </div>
  <div class="text-column">
    <h2>곧 만나요</h2>
    <p>프로젝트가 준비되는 대로 사진, 작가 정보, 개별 작품이 이곳에 추가될 예정입니다.</p>
  </div>
</section>

<section class="posts container" id="artworks">
  <div class="posts-heading">
    <h2>작품</h2>
    <p>개별 작품은 정리되는 대로 이곳에 공개됩니다.</p>
  </div>
  <div id="project-artworks-grid" class="posts-grid"></div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="../js/scroll-expand.js"></script>
<script src="../js/carousel.js"></script>
<script src="../js/project-galleries.js"></script>
<script src="../js/staggered-menu.js"></script>
<script src="../js/target-cursor.js"></script>
<script src="../js/page-transitions.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
